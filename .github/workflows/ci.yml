name: ci

# Issue #141. Until this file existed there was no CI in either mojito repo
# (`gh api .../actions/workflows` returned total_count 0), so every green
# claim in 115 merged PRs was self-reported from the author's laptop against
# a pre-commit gate that a stale `suite` allow-list row had disarmed.
#
# Four lanes:
#   gate-selftest       the gate's own test, no toolchain, runs everywhere
#   suite-macos         the real suite on the kqueue/arm64 host — the
#                        blocking lane
#   suite-linux         the epoll/io_uring/x86-64 host, which has NEVER
#                        executed
#   suite-linux-iouring the Linux io_uring completion-poller lane (issue
#                        #171): drives create_completion_poller() to an
#                        actual SUCCESS with MOJITO_IO_URING=1, not merely
#                        the "raises on a host without it" t39 already
#                        covers.
#
# suite-linux is reported, not blocking, and we now know exactly where it
# stops. It does not reach a single test: `make` fails at
#
#   mojito_async/vendor/mojito-sys/aarch64_switch.S:50:
#     #error "aarch64_switch.S targets Apple arm64 (Mach-O) only"
#
# The vendored context-switch assembly is Apple/Mach-O only, so the runtime
# cannot be BUILT on Linux at all — not on x86-64, and not on Linux/arm64
# either. Canonical mojito-sys ships ms_context_aarch64.S AND
# ms_context_x86_64.S and builds there cleanly (92 exported symbols,
# verified in a container). That is mojito-sys#164 with a sharper edge than
# the issue states: the fork does not merely shed the frozen ABI's safety
# properties, it cannot target the platforms canonical already supports.
#
# So "the Linux lanes have never executed anywhere" has a cause, and it is
# not only the absence of CI. mojito-sys#162 and #163 sit behind this too.
# The lane's job is to keep that visible instead of pretending it is green;
# flip `continue-on-error` off when the substrate builds.
#
# suite-linux-iouring sits behind the EXACT SAME wall: it cannot get past
# `make` either today, for the identical reason. It is added anyway,
# reported rather than blocking, so the lane is ready to actually start
# proving something the moment mojito-sys#164 unblocks the Linux build —
# mojito_async/test/linux/t61_reactor_iouring_completion_aot.mojo and its
# runner (mojito_async/test/linux/run.sh) are already correct and already
# guard-tested (on Darwin, where the guard is expected to trip: see that
# driver's header for the exit-code contract). What this job cannot do
# yet — and what no session working this repo from a macOS host can do
# directly — is exercise the actual success path on a live Linux kernel
# with io_uring; that verification is deferred entirely to this CI runner,
# once it can build at all. Same maintenance note as suite-linux above:
# flip this job's `continue-on-error` off too once `make` succeeds here --
# a real regression in this lane must start blocking the moment it is
# able to, not stay reported-only forever by inertia.
#
# issue #169: the macOS lane's own toolchain + build/ were never cached, so
# every run paid the full ~4 min conda download+unpack plus a from-scratch
# vendor build (measured locally: 6m cold vs 2m warm). Combined with no
# job-level timeout, a stuck run (one was observed in progress on main for
# 30+ min with no verdict, run 33325081492) had no bound at all — GitHub's
# default is 360 minutes. Both are fixed here: actions/cache keyed on the
# install script + Makefile/vendor sources, and an explicit timeout-minutes
# per job so a hang fails loud instead of occupying the runner for hours.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

# issue #179: cancel-in-progress used to be unconditional, which reads as
# "a stale push shouldn't keep burning CI minutes" -- true for a PR branch,
# whose group (refs/pull/N/merge) is unique to that PR's own churn, but
# false for `main`. Every push to `main` shares ONE group
# (ci-refs/heads/main), so during this sweep's multi-agent parallel-merge
# waves each merge's own CI run was getting cancelled by the very next
# merge's push before it ever finished: 18 of the last 19 `main` runs
# observed while fixing this issue were `cancelled`, only 1 ran to a real
# verdict (a failure, not even a pass). That is the exact "no lane ever
# completes, and a cancelled check looks like a healthy one in the UI"
# failure mode #179 raised, just relocated from "queued forever" to
# "cancelled by the next merge" now that the queueing side of it isn't
# reproducing. Scoping cancellation to pull_request events fixes the part
# that was actually observed: a `main` run that has already STARTED no
# longer gets killed by the next merge's push, which is what every one of
# those 18 cancellations was (each job's own "Set up job" step completes
# in ~1s, so by the time a second push realistically lands the prior run
# is already executing, not merely queued).
#
# This is not a full FIFO guarantee, and the comment above should not be
# read as one: GitHub's default concurrency queue depth is 1 pending run
# per group even with cancel-in-progress: false -- if a THIRD push lands
# while a second is already pending behind a first that's still running,
# the second gets silently replaced by the third, same as before, just one
# push later than it used to. `queue: max` (GA since 2026-05) removes that
# cap, but it is documented as incompatible with any run where
# cancel-in-progress evaluates true, and this block's cancel-in-progress is
# a per-run expression that DOES evaluate true for pull_request runs -- so
# adding queue: max here risks breaking every PR's CI on a config this
# entire repo's CI depends on, for a narrow edge case (two merges landing
# within one job's runtime AND a third landing before the first finishes)
# that is already far rarer than the failure mode this fix targets. Left
# as a considered, deliberately deferred follow-up rather than tested live
# on shared infrastructure.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate-selftest:
    name: gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: precommit/test-gate.sh
        env:
          GH_TOKEN: ${{ github.token }}
          # On CI an unverifiable tracking issue is a failure, not a note:
          # the whole point of the row check is that it cannot be skipped.
          MOJITO_GATE_REQUIRE_ISSUE_CHECK: "1"
        run: ./precommit/test-gate.sh

  suite-macos:
    name: suite (macOS arm64, kqueue)
    runs-on: macos-14
    # Measured cold: ~6 min (toolchain fetch + full vendor rebuild). A hang
    # is a defect, not a slow pass, so bound it well above the warm steady
    # state (~2 min) but well below "indistinguishable from stuck".
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache Mojo toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/mojo-toolchain
          key: mojo-toolchain-${{ runner.os }}-${{ hashFiles('.github/scripts/install-mojo.sh') }}
      - name: Install Mojo toolchain
        run: ./.github/scripts/install-mojo.sh
      - name: Cache build/ (vendored substrate objects)
        uses: actions/cache@v4
        with:
          path: build
          key: mojito-async-build-${{ runner.os }}-${{ hashFiles('Makefile', 'mojito_async/vendor/**', 'spike/colorless_runtime/vendor/**') }}
      - name: Build the vendored substrate
        run: make
      - name: Full suite through the pre-commit gate
        env:
          GH_TOKEN: ${{ github.token }}
          MOJITO_GATE_REQUIRE_ISSUE_CHECK: "1"
          # CI never has anything staged (a checkout, not a commit-in-
          # progress), so the tiered hook's diff-based tier selection would
          # already default to "full" here — set it explicitly so the
          # workflow's intent doesn't depend on that fallback (issue #169).
          MOJITO_GATE_TIER: full
        run: ./precommit/gate.sh

  suite-linux:
    name: suite (Linux x86-64, epoll) — reported, not blocking
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    # Every Linux step runs INSIDE a container rather than on the runner
    # image, so the lane is the same environment a developer gets from
    # tests/docker/run-linux-suite.sh and nothing depends on whatever
    # ubuntu-latest happens to ship this month.
    container:
      image: debian:bookworm
    steps:
      - name: Container prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates curl git unzip zstd
      - uses: actions/checkout@v4
      - name: Install Mojo toolchain
        run: ./.github/scripts/install-mojo.sh
      - name: Build the vendored substrate
        run: make
      - name: A1 runtime suite
        run: ./mojito_async/test/run.sh

  suite-linux-iouring:
    name: io_uring completion lane (Linux x86-64, issue #171) — reported, not blocking
    runs-on: ubuntu-latest
    # issue #179: #183 gave every other job in this file a timeout-minutes
    # but missed this one (it was added after #183 landed). Same
    # container+install+build shape as suite-linux, plus one more test
    # script, so it gets the same bound.
    timeout-minutes: 15
    continue-on-error: true
    # Same container-not-runner-image rationale as suite-linux above, and
    # the same `make`-cannot-build-on-Linux-yet ceiling (mojito-sys#164;
    # see this file's header comment). This job is separate from
    # suite-linux, not a step inside it, so its own guard/verdict shows up
    # as its own named check rather than folded into a suite it is not
    # part of (mojito_async/test/linux/run.sh is deliberately NOT wired
    # into mojito_async/test/run.sh or precommit/run-suite.sh — see that
    # script's header).
    container:
      image: debian:bookworm
    steps:
      - name: Container prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates curl git unzip zstd
      - uses: actions/checkout@v4
      - name: Install Mojo toolchain
        run: ./.github/scripts/install-mojo.sh
      - name: Build the vendored substrate
        run: make
      - name: io_uring completion-poller lane (issue #171)
        env:
          MOJITO_IO_URING: "1"
        run: ./mojito_async/test/linux/run.sh
